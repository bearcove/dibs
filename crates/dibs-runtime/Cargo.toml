[package]
name = "dibs-runtime"
version = "0.2.0-rc.5"
edition = "2024"
rust-version.workspace = true
description = "Runtime types for dibs-generated query code"
license = "MIT OR Apache-2.0"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
tokio-postgres.workspace = true
facet.workspace = true
facet-tokio-postgres = { workspace = true, features = ["jiff02", "rust_decimal", "uuid"] }
facet-value.workspace = true
dibs-jsonb = { version = "0.2.0-rc.5", path = "../dibs-jsonb" }
jiff.workspace = true
uuid.workspace = true
rust_decimal.workspace = true
# Structured completion and failure events for generated queries. Runtime
# tracing carries query identity, duration, row/affected counts, and preserved
# PostgreSQL diagnostics, but never SQL bind values.
tracing.workspace = true
