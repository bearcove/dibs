[workspace]
members = ["crates/*"]
exclude = ["examples/admin-ui", "examples/my-app-workspace"]
resolver = "3"

[workspace.package]
rust-version = "1.92"

[workspace.dependencies]
dibs = { path = "crates/dibs", version = "0.2.0-rc.5" }
dibs-config = { path = "crates/dibs-config", version = "0.2.0-rc.5" }
dibs-macros = { path = "crates/dibs-macros", version = "0.2.0-rc.4" }
dibs-proto = { path = "crates/dibs-proto", version = "0.2.0-rc.5" }
dibs-qgen = { path = "crates/dibs-qgen", version = "0.2.0-rc.5" }
dibs-query-schema = { path = "crates/dibs-query-schema", version = "0.2.0-rc.5" }
dibs-db-schema = { path = "crates/dibs-db-schema", version = "0.2.0-rc.5" }
dibs-pg-catalog = { path = "crates/dibs-pg-catalog", version = "0.1.0" }
dibs-query-syntax = { path = "crates/dibs-query-syntax", version = "0.1.0" }
dibs-jsonb = { path = "crates/dibs-jsonb", version = "0.2.0-rc.5" }
dibs-runtime = { path = "crates/dibs-runtime", version = "0.2.0-rc.5" }
dockside = { path = "crates/dockside" }

facet = { git = "https://github.com/facet-rs/facet", branch = "deps/align-weavy-for-dibs" }
facet-core = { git = "https://github.com/facet-rs/facet", branch = "deps/align-weavy-for-dibs" }
facet-value = { git = "https://github.com/facet-rs/facet", branch = "deps/align-weavy-for-dibs" }
facet-json = { git = "https://github.com/facet-rs/facet", branch = "deps/align-weavy-for-dibs" }
facet-reflect = { git = "https://github.com/facet-rs/facet", branch = "deps/align-weavy-for-dibs" }
facet-testhelpers = { git = "https://github.com/facet-rs/facet", branch = "deps/align-weavy-for-dibs" }
facet-tokio-postgres = { path = "crates/facet-tokio-postgres", version = "0.50.0-rc.5" }
figue = { git = "https://github.com/bearcove/figue-next", branch = "deps/align-facet-for-dibs" }
strid = { git = "https://github.com/bearcove/strid", branch = "deps/align-facet-for-dibs" }
snark = { git = "https://github.com/bearcove/snark", branch = "deps/full-weavy-pin-for-dibs" }
snark-dsl = { git = "https://github.com/bearcove/snark", branch = "deps/full-weavy-pin-for-dibs" }
margin = { git = "https://github.com/bearcove/snark", branch = "deps/full-weavy-pin-for-dibs" }
margin-term = { git = "https://github.com/bearcove/snark", branch = "deps/full-weavy-pin-for-dibs" }

facet-styx = { git = "https://github.com/bearcove/styx", branch = "deps/align-facet-for-dibs" }
styx-embed = { git = "https://github.com/bearcove/styx", branch = "deps/align-facet-for-dibs" }
styx-tree = { git = "https://github.com/bearcove/styx", branch = "deps/align-facet-for-dibs", features = ["facet"] }
styx-lsp-ext = { git = "https://github.com/bearcove/styx", branch = "deps/align-facet-for-dibs" }
styx-lsp = { git = "https://github.com/bearcove/styx", branch = "deps/align-facet-for-dibs" }

vox = { git = "https://github.com/bearcove/vox", branch = "deps/align-weavy-for-dibs" }
vox-codegen = { git = "https://github.com/bearcove/vox", branch = "deps/align-weavy-for-dibs" }
vox-stream = { git = "https://github.com/bearcove/vox", branch = "deps/align-weavy-for-dibs" }
vox-websocket = { git = "https://github.com/bearcove/vox", branch = "deps/align-weavy-for-dibs" }
styx-vox-stream = { package = "vox-stream", git = "https://github.com/bearcove/vox-next", branch = "deps/align-weavy-for-styx" }

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = "0.7"
tokio-tungstenite = "0.29"
deadpool-postgres = "0.14"
bytes = "1"
chrono = "0.4"
jiff = "0.2"
postgres-types = "0.2"
rust_decimal = { version = "1", default-features = false }
time = "0.3"
uuid = "1"
thiserror = "2"
crossterm = "0.29"
dotenvy = "0.15"
owo-colors = "4"
ratatui = "0.30"
arborium = { version = "2", features = ["lang-rust"] }
arborium-highlight = "2"
arborium-theme = "2"
ariadne = "0.6"
proc-macro2 = "1"
quote = "1"
unsynn = { version = "0.3", features = ["proc_macro2"] }
codegen = "0.3"
camino = "1"
indexmap = "2"
inventory = "0.3"
blake3 = "1"
insta = "1"
proptest = "1"
tempfile = "3"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }



[profile.test]
opt-level = 3

[profile.dev.package.snark]
opt-level = 3

[profile.dev.package.weavy]
opt-level = 3

[profile.dev.package.weavy-phon]
opt-level = 3

[profile.dev.package.taxon]
opt-level = 3

[profile.dev.package.phon]
opt-level = 3

[profile.dev.package.phon-engine]
opt-level = 3

[profile.dev.package.phon-ir]
opt-level = 3

[profile.dev.package.phon-jit]
opt-level = 3

[profile.dev.package.phon-schema]
opt-level = 3

[profile.dev.package.phon-storage]
opt-level = 3

[profile.dev.package.copypatch]
opt-level = 3
