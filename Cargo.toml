[workspace]
members = ["crates/*"]
exclude = ["examples/admin-ui", "examples/my-app-workspace"]
resolver = "3"

[workspace.package]
rust-version = "1.92"

[workspace.dependencies]
dibs = { path = "crates/dibs", version = "0.2.0-rc.5" }
dibs-config = { path = "crates/dibs-config", version = "0.2.0-rc.5" }
dibs-macros = { path = "crates/dibs-macros", version = "0.2.0-rc.4" }
dibs-proto = { path = "crates/dibs-proto", version = "0.2.0-rc.5" }
dibs-qgen = { path = "crates/dibs-qgen", version = "0.2.0-rc.5" }
dibs-query-schema = { path = "crates/dibs-query-schema", version = "0.2.0-rc.5" }
dibs-db-schema = { path = "crates/dibs-db-schema", version = "0.2.0-rc.5" }
dibs-jsonb = { path = "crates/dibs-jsonb", version = "0.2.0-rc.5" }
dibs-runtime = { path = "crates/dibs-runtime", version = "0.2.0-rc.5" }
dockside = { path = "crates/dockside" }

facet = { git = "https://github.com/facet-rs/facet", rev = "dc57e24e381f0c61b4acfa242c368656a84348d4" }
facet-core = { git = "https://github.com/facet-rs/facet", rev = "dc57e24e381f0c61b4acfa242c368656a84348d4" }
facet-value = { git = "https://github.com/facet-rs/facet", rev = "dc57e24e381f0c61b4acfa242c368656a84348d4" }
facet-json = { git = "https://github.com/facet-rs/facet", rev = "dc57e24e381f0c61b4acfa242c368656a84348d4" }
facet-reflect = { git = "https://github.com/facet-rs/facet", rev = "dc57e24e381f0c61b4acfa242c368656a84348d4" }
facet-testhelpers = { git = "https://github.com/facet-rs/facet", rev = "dc57e24e381f0c61b4acfa242c368656a84348d4" }
facet-tokio-postgres = { path = "crates/facet-tokio-postgres", version = "0.50.0-rc.5" }
figue = { git = "https://github.com/bearcove/figue-next", rev = "c7e1fda97267bafe83c4bbe30b74950a30cf8e5e" }
strid = { git = "https://github.com/bearcove/strid-next", rev = "256531f73b93ff110d390e105c4af8e1f5728dad" }

facet-styx = { git = "https://github.com/bearcove/styx", branch = "restore-from-facet" }
styx-embed = { git = "https://github.com/bearcove/styx", branch = "restore-from-facet" }
styx-tree = { git = "https://github.com/bearcove/styx", branch = "restore-from-facet", features = ["facet"] }
styx-lsp-ext = { git = "https://github.com/bearcove/styx", branch = "restore-from-facet" }
styx-lsp = { git = "https://github.com/bearcove/styx", branch = "restore-from-facet" }

vox = { git = "https://github.com/bearcove/vox-next", rev = "b18398810c404350e70c98527132e965ba878666" }
vox-codegen = { git = "https://github.com/bearcove/vox-next", rev = "b18398810c404350e70c98527132e965ba878666" }
vox-stream = { git = "https://github.com/bearcove/vox-next", rev = "b18398810c404350e70c98527132e965ba878666" }
vox-websocket = { git = "https://github.com/bearcove/vox-next", rev = "b18398810c404350e70c98527132e965ba878666" }

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = "0.7"
tokio-tungstenite = "0.29"
deadpool-postgres = "0.14"
bytes = "1"
chrono = "0.4"
jiff = "0.2"
postgres-types = "0.2"
rust_decimal = { version = "1", default-features = false }
time = "0.3"
uuid = "1"
thiserror = "2"
crossterm = "0.29"
dotenvy = "0.15"
owo-colors = "4"
ratatui = "0.30"
arborium = { version = "2", features = ["lang-rust"] }
arborium-highlight = "2"
arborium-theme = "2"
ariadne = "0.6"
proc-macro2 = "1"
quote = "1"
unsynn = { version = "0.3", features = ["proc_macro2"] }
codegen = "0.3"
camino = "1"
indexmap = "2"
inventory = "0.3"
blake3 = "1"
insta = "1"
proptest = "1"
tempfile = "3"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
