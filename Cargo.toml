[workspace]
members = ["crates/*"]
exclude = ["examples/admin-ui", "examples/my-app-workspace"]
resolver = "3"

[workspace.package]
rust-version = "1.92"

[workspace.dependencies]
dibs = { path = "crates/dibs", version = "0.2.0-rc.7" }
dibs-config = { path = "crates/dibs-config", version = "0.2.0-rc.6" }
dibs-macros = { path = "crates/dibs-macros", version = "0.2.0-rc.6" }
dibs-proto = { path = "crates/dibs-proto", version = "0.2.0-rc.6" }
dibs-qgen = { path = "crates/dibs-qgen", version = "0.2.0-rc.7" }
dibs-query-schema = { path = "crates/dibs-query-schema", version = "0.2.0-rc.7" }
dibs-db-schema = { path = "crates/dibs-db-schema", version = "0.2.0-rc.6" }
dibs-jsonb = { path = "crates/dibs-jsonb", version = "0.2.0-rc.6" }
dibs-runtime = { path = "crates/dibs-runtime", version = "0.2.0-rc.6" }
dockside = { path = "crates/dockside" }

facet = { version = "0.50.0-rc.7" }
facet-core = { version = "0.50.0-rc.7" }
facet-value = { version = "0.50.0-rc.7" }
facet-json = { version = "0.50.0-rc.7" }
facet-reflect = { version = "0.50.0-rc.7" }
facet-testhelpers = { version = "0.50.0-rc.7" }
facet-tokio-postgres = { path = "crates/facet-tokio-postgres", version = "0.50.0-rc.6" }
figue = { version = "5.0.0-rc.6" }
strid = { version = "11.0.0-rc.5" }

facet-styx = { version = "=5.0.0-rc.5" }
styx-embed = { version = "=5.0.0-rc.5" }
styx-tree = { version = "=5.0.0-rc.5", features = ["facet"] }
styx-lsp-ext = { version = "=5.0.0-rc.5" }
styx-lsp = { version = "=5.0.0-rc.5" }

vox = { version = "0.10.0-rc.7" }
vox-codegen = { version = "0.10.0-rc.7" }
vox-stream = { version = "0.10.0-rc.7" }
vox-websocket = { version = "0.10.0-rc.7" }

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = "0.7"
tokio-tungstenite = "0.29"
deadpool-postgres = "0.14"
bytes = "1"
chrono = "0.4"
jiff = "0.2"
postgres-types = "0.2"
rust_decimal = { version = "1", default-features = false }
time = "0.3"
uuid = "1"
thiserror = "2"
crossterm = "0.29"
dotenvy = "0.15"
owo-colors = "4"
ratatui = "0.30"
arborium = { version = "2", features = ["lang-rust"] }
arborium-highlight = "2"
arborium-theme = "2"
ariadne = "0.6"
proc-macro2 = "1"
quote = "1"
unsynn = { version = "0.3", features = ["proc_macro2"] }
codegen = "0.3"
camino = "1"
indexmap = "2"
inventory = "0.3"
blake3 = "1"
insta = "1"
proptest = "1"
tempfile = "3"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

