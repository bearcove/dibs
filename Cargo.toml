[workspace]
members = ["crates/*"]
exclude = ["examples/admin-ui", "examples/my-app-workspace"]
resolver = "3"

[workspace.package]
rust-version = "1.92"

[workspace.dependencies]
dibs = { path = "crates/dibs", version = "0.2.0-rc.5" }
dibs-config = { path = "crates/dibs-config", version = "0.2.0-rc.5" }
dibs-macros = { path = "crates/dibs-macros", version = "0.2.0-rc.4" }
dibs-proto = { path = "crates/dibs-proto", version = "0.2.0-rc.5" }
dibs-qgen = { path = "crates/dibs-qgen", version = "0.2.0-rc.5" }
dibs-query-schema = { path = "crates/dibs-query-schema", version = "0.2.0-rc.5" }
dibs-db-schema = { path = "crates/dibs-db-schema", version = "0.2.0-rc.5" }
dibs-pg-catalog = { path = "crates/dibs-pg-catalog", version = "0.1.0" }
dibs-jsonb = { path = "crates/dibs-jsonb", version = "0.2.0-rc.5" }
dibs-runtime = { path = "crates/dibs-runtime", version = "0.2.0-rc.5" }
dockside = { path = "crates/dockside" }

facet = { git = "https://github.com/facet-rs/facet", rev = "5705fa6c51289bea49f5729c52dc5e23cedce4f8" }
facet-core = { git = "https://github.com/facet-rs/facet", rev = "5705fa6c51289bea49f5729c52dc5e23cedce4f8" }
facet-value = { git = "https://github.com/facet-rs/facet", rev = "5705fa6c51289bea49f5729c52dc5e23cedce4f8" }
facet-json = { git = "https://github.com/facet-rs/facet", rev = "5705fa6c51289bea49f5729c52dc5e23cedce4f8" }
facet-reflect = { git = "https://github.com/facet-rs/facet", rev = "5705fa6c51289bea49f5729c52dc5e23cedce4f8" }
facet-testhelpers = { git = "https://github.com/facet-rs/facet", rev = "5705fa6c51289bea49f5729c52dc5e23cedce4f8" }
facet-tokio-postgres = { path = "crates/facet-tokio-postgres", version = "0.50.0-rc.5" }
figue = { git = "https://github.com/bearcove/figue", rev = "361672c57316b2202ac0372f1c64988d8acfc6b6" }
strid = { git = "https://github.com/bearcove/strid", rev = "c48464a22b6511b0119be92ea2c86c1f61e06153" }
snark = { git = "https://github.com/bearcove/snark", rev = "21ee409c50f15e669fdbbf45a563ee2ac15b9504" }
snark-dsl = { git = "https://github.com/bearcove/snark", rev = "21ee409c50f15e669fdbbf45a563ee2ac15b9504" }
margin = { git = "https://github.com/bearcove/snark", rev = "21ee409c50f15e669fdbbf45a563ee2ac15b9504" }
margin-term = { git = "https://github.com/bearcove/snark", rev = "21ee409c50f15e669fdbbf45a563ee2ac15b9504" }

facet-styx = { git = "https://github.com/bearcove/styx", rev = "fc2814a5ec889338eb1bf9f27425ac7094462265" }
styx-embed = { git = "https://github.com/bearcove/styx", rev = "fc2814a5ec889338eb1bf9f27425ac7094462265" }
styx-tree = { git = "https://github.com/bearcove/styx", rev = "fc2814a5ec889338eb1bf9f27425ac7094462265", features = ["facet"] }
styx-lsp-ext = { git = "https://github.com/bearcove/styx", rev = "fc2814a5ec889338eb1bf9f27425ac7094462265" }
styx-lsp = { git = "https://github.com/bearcove/styx", rev = "fc2814a5ec889338eb1bf9f27425ac7094462265" }

vox = { git = "https://github.com/bearcove/vox", rev = "e875e070d78690f45a06a13e8fc79cef84579ed4" }
vox-codegen = { git = "https://github.com/bearcove/vox", rev = "e875e070d78690f45a06a13e8fc79cef84579ed4" }
vox-stream = { git = "https://github.com/bearcove/vox", rev = "e875e070d78690f45a06a13e8fc79cef84579ed4" }
vox-websocket = { git = "https://github.com/bearcove/vox", rev = "e875e070d78690f45a06a13e8fc79cef84579ed4" }

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = "0.7"
tokio-tungstenite = "0.29"
deadpool-postgres = "0.14"
bytes = "1"
chrono = "0.4"
jiff = "0.2"
postgres-types = "0.2"
rust_decimal = { version = "1", default-features = false }
time = "0.3"
uuid = "1"
thiserror = "2"
crossterm = "0.29"
dotenvy = "0.15"
owo-colors = "4"
ratatui = "0.30"
arborium = { version = "2", features = ["lang-rust"] }
arborium-highlight = "2"
arborium-theme = "2"
ariadne = "0.6"
proc-macro2 = "1"
quote = "1"
unsynn = { version = "0.3", features = ["proc_macro2"] }
codegen = "0.3"
camino = "1"
indexmap = "2"
inventory = "0.3"
blake3 = "1"
insta = "1"
proptest = "1"
tempfile = "3"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[patch.crates-io]
copypatch = { path = "../weavy/copypatch" }
taxon = { path = "../weavy/taxon" }
weavy = { path = "../weavy/weavy" }
weavy-phon = { path = "../weavy/weavy-phon" }

[patch."https://github.com/bearcove/weavy"]
copypatch = { path = "../weavy/copypatch" }
taxon = { path = "../weavy/taxon" }
weavy = { path = "../weavy/weavy" }
weavy-phon = { path = "../weavy/weavy-phon" }

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.facet-postcard]
opt-level = 3

[profile.dev.package.facet-format]
opt-level = 3

[profile.dev.package.facet-reflect]
opt-level = 3

[profile.dev.package.snark]
opt-level = 3
